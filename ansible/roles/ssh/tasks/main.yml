---
- name: Create automation user
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Create SSH directory
  ansible.builtin.file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: "0700"

- name: Install automation public key
  ansible.posix.authorized_key:
    user: devops
    state: present
    key: "{{ lookup('ansible.builtin.file', devops_public_key_file | expanduser) }}"
    manage_dir: false

- name: Allow non-interactive automation sudo
  ansible.builtin.copy:
    content: "devops ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/devops
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Verify key login and sudo before disabling passwords
  ansible.builtin.command:
    argv:
      - ssh
      - -i
      - "{{ devops_private_key_file | expanduser }}"
      - -p
      - "{{ hostvars[inventory_hostname].ansible_port | default(22) }}"
      - -o
      - BatchMode=yes
      - -o
      - IdentitiesOnly=yes
      - -o
      - StrictHostKeyChecking=yes
      - -o
      - "UserKnownHostsFile={{ devops_known_hosts_file | expanduser }}"
      - -o
      - ConnectTimeout=8
      - "devops@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
      - sudo -n true
  delegate_to: localhost
  become: false
  changed_when: false

- name: Harden SSH after verified key login
  ansible.builtin.copy:
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      PermitEmptyPasswords no
      AllowUsers student devops
      X11Forwarding no
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Allow SSH and HTTP in guest firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"

- name: Set incoming firewall policy
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set outgoing firewall policy
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable firewall
  community.general.ufw:
    state: enabled
    logging: low
