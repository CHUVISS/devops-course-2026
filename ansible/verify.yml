---
- name: Verify deployed configuration
  hosts: vm
  become: true
  tasks:
    - name: Check SSH effective configuration
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    - name: Assert password and root login are disabled
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
          - "'permitrootlogin no' in sshd_effective.stdout_lines"

    - name: Read container facts
      community.docker.docker_container_info:
        name: "{{ app_container_name }}"
      register: container_info

    - name: Assert expected container is running on loopback
      ansible.builtin.assert:
        that:
          - container_info.exists
          - container_info.container.State.Running
          - container_info.container.Config.Image == app_image ~ ':' ~ app_tag
          - container_info.container.HostConfig.PortBindings[app_internal_port ~ '/tcp'][0].HostIp == '127.0.0.1'
          - container_info.container.HostConfig.PortBindings[app_internal_port ~ '/tcp'][0].HostPort == app_host_port | string

    - name: Check direct application health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}/health"
        return_content: true
      register: direct_health

    - name: Assert health payload
      ansible.builtin.assert:
        that:
          - direct_health.status == 200
          - direct_health.json.status == 'ok'
